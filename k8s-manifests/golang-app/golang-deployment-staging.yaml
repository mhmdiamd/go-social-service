apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-social-service-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-social-service-staging
  template:
    metadata:
      labels:
        app: go-social-service-staging
    spec:
      containers:
        - name: go-social-service-staging
          image: mhmdiamd/go-social-service-staging
          ports:
            - containerPort: 4000
