# .air.toml
root = "."
tmp_dir = "tmp"
[build]
  cmd = "go build -o ./cmd/api ."
  bin = "./cmd/api"
  full_bin = "./cmd/api"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "frontend"]
  exclude_file = ["*flymake.go", "examples/*.go"]
  exclude_regex = ["_test\\.go"]

[log]
  level = "debug"
  color = "true"

[run]
  cmd = "cmd/api"
  watch_dir = ["."]
  watch_ext = ["go", "tpl", "tmpl", "html"]
  ignore = ["assets", "tmp", "vendor", "frontend"]
  delay = 1000
